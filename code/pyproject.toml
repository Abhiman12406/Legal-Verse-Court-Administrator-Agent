[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lexis-ops"
version = "1.2.0"
description = "LexisOps Autonomous Court Administration & Clerk Assistance Engine"
readme = "Court_Administration_Agent_PRD.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.2.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "google-genai>=0.1.0",
    "instructor>=1.4.0",
    "temporalio>=1.6.0",
    "ortools>=9.9.0",
    "pymupdf>=1.24.0",
    "pypdf>=4.2.0",
    "docling>=1.15.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "Faker>=24.0.0",
    "fakeredis>=2.20.0",
]


[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
python_files = ["test_*.py"]
